<!DOCTYPE html>
<html lang="ru">
<head>
    <title>BAZIS VIEWER OBJ</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #eef1f4; font-family: sans-serif; }
        .ui { position: absolute; z-index: 10; width: 100%; pointer-events: none; padding: 20px; box-sizing: border-box; }
        .ui * { pointer-events: auto; }
        .btn { 
            background: #2c3e50; color: white; border: none; padding: 12px 24px; 
            border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #file-input { display: none; }
        .info { 
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px; border-radius: 20px; font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="ui">
        <label class="btn" for="file-input">📂 Загрузить OBJ</label>
        <input type="file" id="file-input" accept=".obj">
    </div>

    <div class="info" id="status">Выберите .obj файл из Базиса</div>

    <script type="importmap">
        { "imports": {
            "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
        }}
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls, model;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xeef1f4);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000000);
            camera.position.set(1000, 1000, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            const sun = new THREE.DirectionalLight(0xffffff, 0.5);
            sun.position.set(500, 1000, 500);
            scene.add(sun);

            animate();
        }

        const loader = new OBJLoader();

        document.getElementById('file-input').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('status').innerText = "Читаю файл...";
            const reader = new FileReader();

            reader.onload = (event) => {
                if (model) scene.remove(model);

                try {
                    model = loader.parse(event.target.result);
                    
                    model.traverse(child => {
                        if (child.isMesh) {
                            // Назначаем стандартный "мебельный" материал
                            child.material = new THREE.MeshStandardMaterial({ 
                                color: 0xffffff, 
                                roughness: 0.6 
                            });
                            
                            // Рисуем четкие контуры деталей
                            const edges = new THREE.EdgesGeometry(child.geometry);
                            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x333333 }));
                            child.add(line);
                        }
                    });

                    scene.add(model);

                    // Центрируем камеру на новом шкафу
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    
                    camera.position.set(center.x + maxDim, center.y + maxDim, center.z + maxDim);
                    controls.target.copy(center);
                    
                    document.getElementById('status').innerText = "Загружено: " + file.name;
                } catch (err) {
                    document.getElementById('status').innerText = "Ошибка в OBJ файле!";
                    console.error(err);
                }
            };
            reader.readAsText(file);
        };

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
