<!DOCTYPE html>
<html>
<head>
    <title>Базис-Вьювер: Интерактив и Слои</title>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; background: #dcdcdc; font-family: sans-serif; }
        #gui-container { position: absolute; top: 10px; right: 10px; z-index: 100; }
        #info { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 5px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="gui-container"></div>
    <div id="info">Нажмите на деталь для выделения</div>
    <script type="importmap">
        { "imports": {
            "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
        }}
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'https://unpkg.com/dat.gui/build/dat.gui.module.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdcdcdc);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 100000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 0.9));

        const gui = new GUI({ autoPlace: false, width: 300 });
        document.getElementById('gui-container').appendChild(gui.domElement);
        const layersFolder = gui.addFolder('Слои и Блоки');

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let selectedObject = null;
        let originalColor = null;

        const loader = new ColladaLoader();
        loader.load('./model.dae', (collada) => {
            const model = collada.scene;
            const groups = {};

            model.traverse((child) => {
                if (child.isMesh) {
                    // Настройка внешнего вида
                    child.material = new THREE.MeshLambertMaterial({ color: 0xeeeeee });
                    const edges = new THREE.EdgesGeometry(child.geometry);
                    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }));
                    child.add(line);

                    // ЛОГИКА СЛОЕВ: Группируем по родителю или имени
                    const groupName = child.parent.name || "Прочие детали";
                    if (!groups[groupName]) {
                        groups[groupName] = { objects: [], visible: true };
                        const folder = layersFolder.addFolder(groupName);
                        folder.add(groups[groupName], 'visible').name('Показать/Скрыть').onChange(v => {
                            groups[groupName].objects.forEach(obj => obj.visible = v);
                        });
                        groups[groupName].folder = folder;
                    }
                    groups[groupName].objects.push(child);
                }
            });

            // Авто-фокус
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            camera.position.set(center.x + size.x, center.y + size.y, center.z + size.z * 1.5);
            controls.target.copy(center);
            controls.update();
            scene.add(model);
            layersFolder.open();
        });

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.
intersectObjects(scene.children, true);

            if (selectedObject) { selectedObject.material.color.set(originalColor); selectedObject = null; }

            if (intersects.length > 0) {
                const res = intersects.find(i => i.object.isMesh);
                if (res) {
                    selectedObject = res.object;
                    originalColor = selectedObject.material.color.getHex();
                    selectedObject.material.color.set(0xffcc00);
                    document.getElementById('info').innerText = "Деталь: " + (selectedObject.name || "Без имени");
                }
            }
        });

        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
        animate();
    </script>
</body>
</html>
