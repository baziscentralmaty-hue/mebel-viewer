<!DOCTYPE html>
<html>
<head>
    <title>Базис-Вьювер Pro</title>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; background: #2a2a2a; font-family: sans-serif; }
        #gui-container { position: absolute; top: 10px; right: 10px; }
    </style>
</head>
<body>
    <div id="gui-container"></div>
    <script type="importmap">
        { "imports": {
            "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
        }}
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'https://unpkg.com/dat.gui/build/dat.gui.module.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 100000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        
        // Улучшенный свет
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(5000, 5000, 5000);
        scene.add(sun);

        const gui = new GUI({ autoPlace: false, width: 300 });
        document.getElementById('gui-container').appendChild(gui.domElement);
        const layersFolder = gui.addFolder('Структура изделия');

        const loader = new ColladaLoader();
        loader.load('./model.dae', (collada) => {
            const model = collada.scene;
            
            // Добавляем контуры (грани) каждой детали
            model.traverse((child) => {
                if (child.isMesh) {
                    // Создаем черные линии на ребрах
                    const edges = new THREE.EdgesGeometry(child.geometry);
                    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }));
                    child.add(line); 

                    // Группировка в меню
                    const name = child.name || "Деталь";
                    const settings = { visible: true };
                    layersFolder.add(settings, 'visible').name(name).onChange(v => {
                        child.visible = v;
                        line.visible = v;
                    });
                }
            });

            // Авто-фокус
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            camera.position.set(center.x + maxDim, center.y + maxDim, center.z + maxDim * 1.5);
            controls.target.copy(center);
            controls.update();
            
            scene.add(model);
            layersFolder.open();
        });

        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
        animate();
    </script>
</body>
</html>
