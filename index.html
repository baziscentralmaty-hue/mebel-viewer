<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3D Viewer BAZIS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #eceff1; }
        
        /* Панель управления */
        .controls {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            background: white; padding: 12px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; gap: 10px;
        }

        .btn {
            background: #2c3e50; color: white; border: none; padding: 10px 18px;
            border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
        }
        
        .btn:hover { background: #34495e; }
        
        #file-input { display: none; }

        /* Список слоев/деталей */
        .parts-panel {
            position: absolute; top: 80px; right: 15px; width: 260px;
            background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            max-height: 70vh; display: none; flex-direction: column; z-index: 10;
        }

        .parts-header { padding: 12px; border-bottom: 1px solid #eee; font-weight: bold; color: #2c3e50; }
        .parts-list { overflow-y: auto; padding: 10px; }
        .part-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 8px; border-bottom: 1px solid #f5f5f5; font-size: 13px;
        }

        /* Индикатор состояния */
        #status {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.9); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 12px; z-index: 5;
        }
    </style>
</head>
<body>

    <div class="controls">
        <label class="btn" for="file-input">📂 Открыть мебель (.wrl)</label>
        <input type="file" id="file-input" accept=".wrl">
        <button class="btn" onclick="toggleParts()">📦 Детали</button>
    </div>

    <div class="parts-panel" id="partsPanel">
        <div class="parts-header">Список элементов</div>
        <div class="parts-list" id="partsList"></div>
    </div>

    <div id="status">Ожидание файла из Базиса...</div>

    <script type="importmap">
        { "imports": {
            "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
        }}
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRMLLoader } from 'three/addons/loaders/VRMLLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls, currentModel;
        let elementsMap = {};

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf1f3f4);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000000);
            camera.position.set(1000, 1000, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Свет
            scene.add(new THREE.AmbientLight(0xffffff, 1.2));
            const sun = new THREE.DirectionalLight(0xffffff, 0.6);
            sun.position.set(2000, 5000, 2000);
            scene.add(sun);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        const loader = new VRMLLoader();

        document.getElementById('file-input').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            document.getElementById('status').innerText = "Анализ файла...";

            reader.onload = (event) => {
                let content = event.target.result;
                
                // Проверка на корректность текста (если закрались кракозябры)
                if (content.includes('')) {
                    console.warn("Похоже на ошибку кодировки. Пробую Windows-1251...");
                    const retryReader = new FileReader();
                    retryReader.onload = (reEvent) => loadWRL(reEvent.target.result);
                    retryReader.readAsText(file, 'windows-1251');
                } else {
                    loadWRL(content);
                }
            };
            reader.readAsText(file);
        };

        function loadWRL(text) {
            try {
                if (currentModel) scene.remove(currentModel);
                elementsMap = {};
                document.getElementById('partsList').innerHTML = '';

                currentModel = loader.parse(text);
                
                currentModel.traverse(child => {
                    if (child.isMesh) {
                        // Делаем детали красивыми (двусторонними)
                        child.material.side = THREE.DoubleSide;
                        
                        // Получаем нормальное имя детали из Базиса
                        let name = child.name || child.parent.name || "Безымянная деталь";
                        
                        if (!elementsMap[name]) {
                            elementsMap[name] = [];
                            addPartToUI(name);
                        }
                        elementsMap[name].push(child);
                    }
                });

                scene.add(currentModel);
                focusModel();
                document.getElementById('status').innerText = "Модель успешно загружена";
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = "Ошибка парсера: возможно, файл не VRML 2.0";
            }
        }

        function addPartToUI(name) {
            const list = document.getElementById('partsList');
            const item = document.createElement('div');
            item.className = 'part-item';
            item.innerHTML = `
                <span>${name}</span>
                <input type="checkbox" checked onclick="window.togglePart('${name}', this.checked)">
            `;
            list.appendChild(item);
        }

        function focusModel() {
            const box = new THREE.Box3().setFromObject(currentModel);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            
            camera.position.set(center.x + maxDim, center.y + maxDim, center.z + maxDim);
            controls.target.copy(center);
            controls.update();
        }

        window.togglePart = (name, visible) => {
            elementsMap[name].forEach(obj => obj.visible = visible);
        };

        window.toggleParts = () => {
            const p = document.getElementById('partsPanel');
            p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
        };

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
